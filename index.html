<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mage Battle RPG - المواجهة النهائية</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        /* شاشة اختيار المنزل */
        #selection-screen { position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 60; transition: opacity 0.5s; }
        #selection-screen h1 { font-size: 32px; margin-bottom: 30px; text-shadow: 0 0 10px #fff; text-align: center;}
        .house-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 600px; padding: 20px; }
        .house-btn { background-color: #222; border: 3px solid #555; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .house-btn:active { transform: scale(0.95); }
        .house-emoji { font-size: 50px; display: block; margin-bottom: 10px; }
        .house-name { font-size: 20px; font-weight: bold; }
        
        /* ألوان المنازل */
        #lion-pick { border-color: #c0392b; background-color: rgba(192, 57, 43, 0.2); }
        #snake-pick { border-color: #27ae60; background-color: rgba(39, 174, 96, 0.2); }
        #badger-pick { border-color: #f1c40f; background-color: rgba(241, 196, 15, 0.2); }
        #eagle-pick { border-color: #3498db; background-color: rgba(52, 152, 219, 0.2); }

        /* واجهة اللعبة الأساسية */
        #game-screen { display: none; position: relative; width: 100%; height: 100%; flex-direction: column; justify-content: flex-start; align-items: center; opacity: 0; transition: opacity 0.5s; }
        #ui-top { position: absolute; top: 10px; width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 0 10px; box-sizing: border-box; z-index: 10; }
        .stats-container { width: 45%; display: flex; flex-direction: column; gap: 5px; }
        .bar-border { width: 100%; height: 15px; background-color: #333; border: 2px solid #777; border-radius: 8px; position: relative; overflow: hidden; }
        .bar-fill { width: 100%; height: 100%; transition: width 0.3s ease-out; border-radius: 5px; float: left; }
        .hp-fill { background-color: #c0392b; }
        .mana-fill { background-color: #3498db; }
        .wizard-label { font-size: 16px; font-weight: bold; margin-bottom: 2px; text-shadow: 0 0 5px #000; }

        canvas { background: linear-gradient(to bottom, #1a252f 0%, #0d1117 100%); border: 3px solid #34495e; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 95%; max-height: 50vh; margin-top: 50px;}

        /* لوحة تحكم الأدوار */
        #turn-controls { width: 100%; max-width: 900px; background-color: rgba(26, 29, 41, 0.95); border-top: 3px solid #444; border-radius: 15px 15px 0 0; padding: 15px; box-sizing: border-box; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 10px; backdrop-filter: blur(5px); position: absolute; bottom: 0; }
        #turn-message { font-size: 18px; font-weight: bold; text-align: center; color: #f1c40f; height: 25px; min-height: 25px;}
        #action-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 10px 18px; background-color: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; backdrop-filter: blur(2px); -webkit-tap-highlight-color: transparent; transition: background 0.2s; font-family: inherit;}
        .btn:active { background-color: rgba(255, 255, 255, 0.3); transform: scale(0.98); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-attack { border-color: #e74c3c; }
        .btn-defense { border-color: #3498db; }
        .btn-heal { border-color: #2ecc71; }
        .btn-mana { border-color: #f1c40f; }

        /* أوفرلاي حجر ورقة مقص (RPS) */
        #rps-overlay { position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; border-radius: 10px; }
        #rps-overlay h2 { margin-bottom: 5px; color: #fff; text-align: center; font-size: 24px;}
        #rps-attacker-msg { color: #e74c3c; font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        #rps-btns { display: flex; gap: 25px; }
        .rps-btn { font-size: 60px; background: none; border: none; cursor: pointer; transition: transform 0.2s; -webkit-tap-highlight-color: transparent;}
        .rps-btn:active { transform: scale(0.9); }

        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; display: none; text-align: center; z-index: 50; background: rgba(0,0,0,0.95); padding: 30px; border-radius: 15px; border: 3px solid #fff; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>

    <!-- شاشة اختيار المنزل -->
    <div id="selection-screen" style="display: flex;">
        <h1>اختر منزلك لبدء المبارزة السحرية</h1>
        <div class="house-grid">
            <div class="house-btn" id="lion-pick">
                <span class="house-emoji">🦁</span>
                <span class="house-name">جريفندور</span>
            </div>
            <div class="house-btn" id="snake-pick">
                <span class="house-emoji">🐍</span>
                <span class="house-name">سليذرين</span>
            </div>
            <div class="house-btn" id="badger-pick">
                <span class="house-emoji">🦡</span>
                <span class="house-name">هوفلباف</span>
            </div>
            <div class="house-btn" id="eagle-pick">
                <span class="house-emoji">🦅</span>
                <span class="house-name">راونكلو</span>
            </div>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen">
        <div id="ui-top">
            <div dir="ltr" class="stats-container">
                <div class="wizard-label" id="p1-label" style="text-align: right;">🧙‍♂️ أنت</div>
                <div class="bar-border"><div id="p1-hp" class="bar-fill hp-fill"></div></div>
                <div class="bar-border" style="height: 10px; border-color: #555;"><div id="p1-mana" class="bar-fill mana-fill"></div></div>
            </div>
            <div dir="ltr" class="stats-container">
                <div class="wizard-label" id="p2-label" style="text-align: left;">🧙‍♀️ الكمبيوتر</div>
                <div class="bar-border"><div id="p2-hp" class="bar-fill hp-fill"></div></div>
                <div class="bar-border" style="height: 10px; border-color: #555;"><div id="p2-mana" class="bar-fill mana-fill"></div></div>
            </div>
        </div>

        <div id="game-over">اللاعب الفائز!<br><button onclick="location.reload()" style="padding: 10px 20px; font-size: 18px; margin-top: 15px; cursor: pointer;">مبارزة جديدة</button></div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- أوفرلاي RPS -->
        <div id="rps-overlay">
            <h2>المواجهة السحرية! التعادل يعيد الكرة🤝</h2>
            <div id="rps-attacker-msg">أنت تهاجم بـانسينديو! اختر حجر ورقة مقص ✊✋✌️</div>
            <div id="rps-btns">
                <button class="rps-btn" id="rps-rock">✊</button>
                <button class="rps-btn" id="rps-paper">✋</button>
                <button class="rps-btn" id="rps-scissors">✌️</button>
            </div>
        </div>

        <!-- لوحة تحكم الأدوار -->
        <div id="turn-controls">
            <div id="turn-message">انتظر دورك...</div>
            <div id="action-btns">
                <button class="btn btn-attack" id="btn-rictusempra">ريكتومسيمبرا (10💧)</button>
                <button class="btn btn-attack" id="btn-expelliarmus">اكسبلياراموس (15💧)</button>
                <button class="btn btn-attack" id="btn-incendio">انسينديو (25💧)</button>
                <button class="btn btn-defense" id="btn-protego">بروتيجو (10💧)</button>
                <button class="btn btn-heal" id="btn-episkey">ايبسكي (20💧)</button>
                <button class="btn btn-mana" id="btn-meditate">تأمل (+25💧)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // عناصر واجهة المستخدم
        const ui = {
            selection: document.getElementById('selection-screen'),
            game: document.getElementById('game-screen'),
            p1Hp: document.getElementById('p1-hp'), p1Mana: document.getElementById('p1-mana'), p1Label: document.getElementById('p1-label'),
            p2Hp: document.getElementById('p2-hp'), p2Mana: document.getElementById('p2-mana'), p2Label: document.getElementById('p2-label'),
            message: document.getElementById('turn-message'),
            btns: {
                rictusempra: document.getElementById('btn-rictusempra'), expelliarmus: document.getElementById('btn-expelliarmus'),
                incendio: document.getElementById('btn-incendio'), protego: document.getElementById('btn-protego'),
                episkey: document.getElementById('btn-episkey'), meditate: document.getElementById('btn-meditate')
            },
            rps: { overlay: document.getElementById('rps-overlay'), rock: document.getElementById('rps-rock'), paper: document.getElementById('rps-paper'), scissors: document.getElementById('rps-scissors'), attackerMsg: document.getElementById('rps-attacker-msg') },
            gameOver: document.getElementById('game-over')
        };

        const gravity = 0.6;
        let isGameOver = false;
        let gameActive = false;
        let p1, p2;
        let turnContext = { attacker: null, defender: null, spell: null, currentTurn: 'player' };

        // بيانات المنازل المحدثة بالإيموجي واللون (تم حذف روابط الصور)
        const houses = {
            lion: { name: 'جريفندور', color: '#c0392b', emoji: '🧙‍♂️' },
            snake: { name: 'سليذرين', color: '#27ae60', emoji: '🧙‍♀️' },
            badger: { name: 'هوفلباف', color: '#f1c40f', emoji: '🧙‍♂️' },
            eagle: { name: 'راونكلو', color: '#3498db', emoji: '🧙‍♀️' }
        };

        const spellBook = {
            rictusempra: { name: 'Rictusempra', damage: 15, cost: 10, color: '#f1c40f', type: 'attack' },
            expelliarmus: { name: 'Expelliarmus', damage: 20, cost: 15, color: '#e74c3c', type: 'attack' },
            incendio: { name: 'Incendio', damage: 35, cost: 25, color: '#e67e22', type: 'attack' },
            protego: { name: 'Protego', damage: 0, cost: 10, color: '#3498db', type: 'defense' },
            episkey: { name: 'Episkey', heal: 30, cost: 20, color: '#2ecc71', type: 'heal' }
        };

        // --- كلاس اللاعب المُحدث ليرسم إيموجي منور بلون الهاوس ---
        class Wizard {
            constructor(x, house, isFacingRight) {
                // ضبط الحجم ليناسب رسم النص
                this.width = 100; 
                this.height = 100;
                this.x = x; 
                this.y = canvas.height - 30 - this.height - 10; // فوق الأرضية قليلاً
                this.house = house;
                this.health = 100; this.mana = 100;
                this.isShielding = false; this.isFacingRight = isFacingRight;
            }

            draw() {
                if (isGameOver) return;
                
                // حفظ سياق الرسم الحالي
                ctx.save();
                
                // --- إضافة تأثير التوهج النيون (منور بلون الهاوس) ---
                ctx.shadowColor = this.house.color;
                ctx.shadowBlur = 30; // قوة التوهج
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                // إعدادات الخط لرسم الإيموجي
                ctx.font = '100px Arial'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // تحديد لون ملء النص (يمكن جعله أبيض أو درجة فاتحة جداً من لون الهاوس لزيادة تأثير النيون)
                ctx.fillStyle = 'white'; 

                // إحداثيات مركز الرسم
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                
                // رسم درع Protego خلف الساحر لو متفعل (بأنيميشن توهج منفصل)
                if (this.isShielding) {
                    ctx.beginPath(); ctx.arc(centerX, centerY, 70, 0, Math.PI * 2);
                    ctx.strokeStyle = this.house.color; ctx.lineWidth = 6;
                    
                    // توهج إضافي للدرع
                    ctx.save();
                    ctx.shadowColor = this.house.color; ctx.shadowBlur = 20;
                    ctx.stroke();
                    ctx.restore();
                    
                    ctx.fillStyle = this.house.color.replace('1)', '0.15)'); ctx.fill();
                    // إعادة ضبط fillStyle للإيموجي
                    ctx.fillStyle = 'white';
                }

                // عكس الاتجاه لو الساحر باصص شمال
                ctx.translate(centerX, centerY);
                if (!this.isFacingRight) {
                    ctx.scale(-1, 1);
                }
                
                // رسم إيموجي الساحر المنور
                ctx.fillText(this.house.emoji, 0, 0); 
                
                // استعادة سياق الرسم الأصلي (إلغاء التوهج للرسومات التالية)
                ctx.restore();
            }

            canCast(spell) { return this.mana >= spell.cost; }
            consumeMana(spell) { this.mana -= spell.cost; if(this.mana < 0) this.mana = 0; }
        }

        // تحديث شرائط الإحصائيات
        function updateStatsUI() {
            ui.p1Hp.style.width = p1.health + '%'; ui.p1Mana.style.width = p1.mana + '%';
            ui.p2Hp.style.width = p2.health + '%'; ui.p2Mana.style.width = p2.mana + '%';
        }

        // --- تهيئة اللعبة واستقبال الأدوار ---
        function chooseHouse(houseKey) {
            ui.selection.style.opacity = '0';
            setTimeout(() => {
                ui.selection.style.display = 'none';
                ui.game.style.display = 'flex';
                ui.game.style.opacity = '1';
                
                const p1Data = houses[houseKey];
                ui.p1Label.innerText = `🧙‍♂️ أنت (${p1Data.name})`;
                ui.p1Label.style.color = p1Data.color; ui.p1Hp.style.backgroundColor = p1Data.color;
                
                const other = Object.keys(houses).filter(k => k !== houseKey);
                const p2Data = houses[other[Math.floor(Math.random() * other.length)]];
                ui.p2Label.innerText = `🧙‍♀️ الكمبيوتر (${p2Data.name})`;
                ui.p2Label.style.color = p2Data.color; ui.p2Hp.style.backgroundColor = p2Data.color;

                // إنشاء اللاعبين (الأحجام محددة داخل الكلاس)
                p1 = new Wizard(100, p1Data, true); // أنت باصص يمين
                p2 = new Wizard(canvas.width - 100 - 100, p2Data, false); // الكمبيوتر باصص شمال
                
                gameActive = true;
                updateStatsUI();
                animate();
                startP1Turn();
            }, 500);
        }

        document.getElementById('lion-pick').addEventListener('click', () => chooseHouse('lion'));
        document.getElementById('snake-pick').addEventListener('click', () => chooseHouse('snake'));
        document.getElementById('badger-pick').addEventListener('click', () => chooseHouse('badger'));
        document.getElementById('eagle-pick').addEventListener('click', () => chooseHouse('eagle'));


        // --- نظام الأدوار و الـ RPS ---
        function toggleButtons(enable) {
            Object.values(ui.btns).forEach(btn => btn.disabled = !enable);
        }

        function handleP1Action(spellKey) {
            if (isGameOver || turnContext.currentTurn !== 'player') return;
            const spell = spellBook[spellKey];

            if (!p1.canCast(spell)) {
                ui.message.innerText = `❌ المانا غير كافية لتعويذة ${spell.name}! استخدم التأمل.`;
                return;
            }

            if (spell.type === 'attack') {
                turnContext.attacker = p1; turnContext.defender = p2; turnContext.spell = spell;
                p1.isShielding = false; toggleButtons(false);
                ui.rps.overlay.style.display = 'flex';
                ui.rps.attackerMsg.innerText = `أنت تهاجم بـ ${spell.name}! اختر حجر ورقة مقص ✊✋✌️`;
                ui.rps.attackerMsg.style.color = '#fff';
            } else if (spell.type === 'defense') {
                executeDefense(p1, spell);
            } else if (spell.type === 'heal') {
                executeHeal(p1, spell);
            }
        }

        ui.btns.meditate.addEventListener('click', () => {
            if (isGameOver || turnContext.currentTurn !== 'player') return;
            p1.mana += 25; if (p1.mana > 100) p1.mana = 100;
            ui.message.innerText = 'أنت تتأمل بعمق وتستعيد 25 نقطة مانا 💧.';
            p1.isShielding = false; updateStatsUI(); toggleButtons(false);
            setTimeout(startAITurn, 1500);
        });

        // حجر ورقة مقص التفاعلي - التعادل يعيد الكرة
        function handleRPS(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const aiChoice = choices[Math.floor(Math.random() * choices.length)];
            const rpsEmojis = { rock: '✊', paper: '✋', scissors: '✌️' };

            const isPlayerAttacking = (turnContext.attacker === p1);
            
            // تحقق من التعادل أولاً
            if (playerChoice === aiChoice) {
                // تعادل: حدث الرسالة داخل الـ Overlay ولا تغلقه
                ui.rps.attackerMsg.innerText = `تعادل🤝 ${rpsEmojis[playerChoice]} ضد ${rpsEmojis[aiChoice]}! أعد الكرة بسرعة!`;
                ui.rps.attackerMsg.style.color = '#f1c40f'; // لون أصفر للتعادل
                // الـ Overlay يظل مفتوحاً، واللاعب يضغط مرة أخرى
                return;
            }

            // لو مفيش تعادل، كمل السيناريو العادي واقفل الـ Overlay
            ui.rps.overlay.style.display = 'none';
            ui.message.innerText = `أنت اخترت ${rpsEmojis[playerChoice]}، الكمبيوتر اختار ${rpsEmojis[aiChoice]}...`;

            setTimeout(() => {
                let damageMultiplier = 1;
                // حساب الفائز في RPS لتحديد الضرر
                if ( (playerChoice === 'rock' && aiChoice === 'scissors') || (playerChoice === 'paper' && aiChoice === 'rock') || (playerChoice === 'scissors' && aiChoice === 'paper') ) {
                    // اللاعب كسب الـ RPS
                    if (isPlayerAttacking) { ui.message.innerText += ' كسبت المواجهة🔥! ضررك كامل.'; damageMultiplier = 1; } 
                    else { ui.message.innerText += ' دافعت بنجاح🛡️! ضرر الكمبيوتر النص.'; damageMultiplier = 0.5; }
                } else {
                    // اللاعب خسر الـ RPS
                    if (isPlayerAttacking) { ui.message.innerText += ' صدوك🛡️! ضررك النص بس.'; damageMultiplier = 0.5; } 
                    else { ui.message.innerText += ' فشلت في الدفاع💥! ضرر الكمبيوتر كامل.'; damageMultiplier = 1; }
                }
                
                // تنفيذ الهجوم بعد RPS
                setTimeout(() => { executeAttack(turnContext.attacker, turnContext.defender, turnContext.spell, damageMultiplier); }, 1000);
            }, 1000);
        }

        ui.rps.rock.addEventListener('click', () => handleRPS('rock'));
        ui.rps.paper.addEventListener('click', () => handleRPS('paper'));
        ui.rps.scissors.addEventListener('click', () => handleRPS('scissors'));


        // --- تنفيذ التعاويذ ---
        function executeAttack(caster, target, spell, multiplier = 1) {
            caster.consumeMana(spell);
            let finalDamage = spell.damage * multiplier;
            if (target.isShielding) { finalDamage *= 0.5; ui.message.innerText += ` لكن الدرع Protego قلل الضرر النص!`; }
            target.health -= finalDamage; if (target.health < 0) target.health = 0;
            updateStatsUI();
            const casterType = (caster === p1) ? 'أنت' : 'الكمبيوتر';
            const msg = (caster === p1) ? ui.message.innerText : `${casterType} ألقى تعويذة ${spell.name}`;
            ui.message.innerText = msg;
            if (target.health <= 0) { endGame((caster === p1) ? 'لقد فزت! بطل هوجوورتس🏆🧙‍♂️' : 'الكمبيوتر هزمك! حاول مرة أخرى🐍'); return; }
            if (caster === p1) setTimeout(startAITurn, 1500);
            else startP1Turn();
        }

        function executeDefense(caster, spell) {
            caster.consumeMana(spell); caster.isShielding = true; updateStatsUI();
            const casterType = (caster === p1) ? 'أنت تفعل' : 'الكمبيوتر يفعل';
            ui.message.innerText = `${casterType} تعويذة بروتيجو 🛡️. أنت محمي بنسبة 50% الدور الجاي.`;
            toggleButtons(false);
            if (caster === p1) setTimeout(startAITurn, 1500);
            else startP1Turn();
        }

        function executeHeal(caster, spell) {
            caster.consumeMana(spell); caster.isShielding = false; caster.health += spell.heal;
            if (caster.health > 100) caster.health = 100; updateStatsUI();
            const casterType = (caster === p1) ? 'أنت تستخدم' : 'الكمبيوتر يستخدم';
            ui.message.innerText = `${casterType} تعويذة ايبسكي ✨ وتستعيد جزءاً من صحتك.`;
            toggleButtons(false);
            if (caster === p1) setTimeout(startAITurn, 1500);
            else startP1Turn();
        }

        // --- دور الكمبيوتر (AI) الذكي والمنصف ---
        function startP1Turn() {
            if (isGameOver) return;
            turnContext.currentTurn = 'player'; toggleButtons(true);
            ui.message.innerText = 'دورك! اختر تعويذة من لوحة التحكم 👇.';
            ui.message.style.color = '#f1c40f';
        }

        function startAITurn() {
            if (isGameOver) return;
            turnContext.currentTurn = 'ai'; toggleButtons(false);
            ui.message.innerText = 'دور الكمبيوتر... يفكر 🧠.';
            ui.message.style.color = '#e74c3c';
            p2.isShielding = false; // فك الدرع في بداية دوره

            setTimeout(() => {
                if (p2.health < 40 && p2.canCast(spellBook.episkey)) { executeHeal(p2, spellBook.episkey); }
                else if (p2.mana < 15) {
                    p2.mana += 25; if (p2.mana > 100) p2.mana = 100;
                    ui.message.innerText = 'الكمبيوتر يتأمل ويستعيد المانا 💧.'; updateStatsUI();
                    setTimeout(startP1Turn, 1500);
                }
                else if (p1.isShielding && p2.canCast(spellBook.protego) && Math.random() < 0.5) { executeDefense(p2, spellBook.protego); }
                else {
                    let spellToCast = spellBook.rictusempra;
                    if (p2.canCast(spellBook.incendio)) spellToCast = spellBook.incendio;
                    else if (p2.canCast(spellBook.expelliarmus)) spellToCast = spellBook.expelliarmus;
                    turnContext.attacker = p2; turnContext.defender = p1; turnContext.spell = spellToCast;
                    ui.message.innerText = `الكمبيوتر يهاجمك بـ ${spellToCast.name}! دافع عن نفسك⚔️`;
                    setTimeout(() => {
                        ui.rps.overlay.style.display = 'flex';
                        ui.rps.attackerMsg.innerText = `الكمبيوتر يهاجمك بـ ${spellToCast.name}! اختر حجر ورقة مقص بسرعة للدفاع 🛡️✊✋✌️`;
                        ui.rps.attackerMsg.style.color = '#e74c3c';
                    }, 800);
                }
            }, 1500);
        }

        function endGame(message) {
            isGameOver = true; toggleButtons(false); gameActive = false;
            ui.gameOver.innerHTML = message + '<br><button onclick="location.reload()" style="padding: 10px 20px; font-size: 18px; margin-top: 15px; cursor: pointer; background:#f1c40f; border:none; border-radius:5px; font-weight:bold;">مبارزة جديدة</button>';
            ui.gameOver.style.display = 'block'; ui.message.innerText = 'انتهت المبارزة.';
        }

        // ربط أزرار التعاويذ باللاعب
        ui.btns.rictusempra.addEventListener('click', () => handleP1Action('rictusempra'));
        ui.btns.expelliarmus.addEventListener('click', () => handleP1Action('expelliarmus'));
        ui.btns.incendio.addEventListener('click', () => handleP1Action('incendio'));
        ui.btns.protego.addEventListener('click', () => handleP1Action('protego'));
        ui.btns.episkey.addEventListener('click', () => handleP1Action('episkey'));

        // --- الـ Game Loop (للرسم فقط) ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, canvas.height - 30, canvas.width, 30); // الأرضية
            if (p1 && p2) { p1.draw(); p2.draw(); }
            if (gameActive) window.requestAnimationFrame(animate);
        }

        // تشغيل اللعبة مباشرة (تم حذف انتظار الصور)
        animate();

    </script>
</body>
</html>
