<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hogwarts Battle - Ultimate Edition</title>
    <style>
        body { margin: 0; background-color: #050505; display: flex; flex-direction: column; align-items: center; min-height: 100dvh; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; touch-action: none; box-sizing: border-box;}
        *, *::before, *::after { box-sizing: border-box; }
        
        #selection-screen { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 60; transition: opacity 0.5s; }
        #selection-screen h1 { font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.8); text-align: center; font-weight: 900; letter-spacing: 2px;}
        .house-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 90%; max-width: 550px; }
        .house-btn { background-color: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); position: relative; overflow: hidden;}
        .house-btn::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s;}
        .house-btn:hover::before { opacity: 1; }
        .house-btn:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
        .house-btn:active { transform: scale(0.95); }
        .house-name { font-size: 26px; font-weight: 900; display: block; position: relative; z-index: 1;}
        
        #lion-pick { border-color: #e74c3c; color: #ff7675; text-shadow: 0 0 15px rgba(231, 76, 60, 0.8), 0 0 5px rgba(231, 76, 60, 1);}
        #snake-pick { border-color: #2ecc71; color: #55efc4; text-shadow: 0 0 15px rgba(46, 204, 113, 0.8), 0 0 5px rgba(46, 204, 113, 1);}
        #badger-pick { border-color: #f1c40f; color: #ffeaa7; text-shadow: 0 0 15px rgba(241, 196, 15, 0.8), 0 0 5px rgba(241, 196, 15, 1);}
        #eagle-pick { border-color: #3498db; color: #74b9ff; text-shadow: 0 0 15px rgba(52, 152, 219, 0.8), 0 0 5px rgba(52, 152, 219, 1);}

        /* Game Screen */
        #game-screen { display: none; position: relative; width: 100%; height: 100dvh; flex-direction: column; align-items: center; opacity: 0; transition: opacity 0.5s; direction: ltr;}
        
        #ui-top { position: absolute; top: 15px; width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 0 15px; z-index: 10; }
        
        .stats-wrapper { width: 45%; display: flex; flex-direction: column; gap: 6px; }
        .p1-stats { align-items: flex-start; }
        .p2-stats { align-items: flex-end; }
        
        .wizard-label { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-shadow: 2px 2px 4px #000, 0 0 10px currentColor; margin-bottom: 2px;}
        
        .hp-bar-container { width: 100%; height: 26px; background-color: rgba(0,0,0,0.6); border: 2px solid; border-radius: 12px; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.9); overflow: hidden; backdrop-filter: blur(4px);}
        #p1-hp-container { border-color: rgba(0, 255, 255, 0.6); } 
        #p2-hp-container { border-color: rgba(57, 255, 20, 0.6); } 
        .hp-fill { height: 100%; background: linear-gradient(90deg, #c0392b, #ff4757); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #p1-hp { box-shadow: inset -5px 0 10px rgba(0,0,0,0.3); }
        #p2-hp { box-shadow: inset 5px 0 10px rgba(0,0,0,0.3); }
        
        .mana-bar-container { width: 85%; height: 10px; background-color: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; position: relative; overflow: hidden;}
        .mana-fill { height: 100%; background: linear-gradient(90deg, #0984e3, #74b9ff); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px #74b9ff;}

        /* Canvas Wrapper */
        #canvas-wrapper { width: 100%; max-width: 800px; flex: 1; display: flex; justify-content: center; align-items: center; margin-top: 60px; margin-bottom: 220px;}
        canvas { background-color: #020617; border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.05); width: 95%; max-height: 48vh; object-fit: contain;}

        /* Controls */
        #turn-controls { width: 100%; max-width: 800px; background: linear-gradient(to top, rgba(2, 6, 23, 1) 40%, rgba(2, 6, 23, 0.85)); border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 10px 25px 10px; position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; z-index: 15; direction: rtl; backdrop-filter: blur(10px);}
        #turn-message { font-size: 20px; font-weight: 900; text-align: center; color: #f1c40f; min-height: 28px; margin-bottom: 12px; text-shadow: 0 0 10px rgba(241, 196, 15, 0.6), 0 0 20px #000; letter-spacing: 0.5px;}
        #action-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%;}
        
        .btn { padding: 10px 14px; background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-bottom: 3px solid; border-radius: 8px; font-size: 15px; font-weight: 800; color: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); min-width: 120px; text-shadow: 1px 1px 2px #000;}
        .btn:active { transform: scale(0.92); border-bottom-width: 1px; margin-top: 2px;}
        .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); border-color: #555 !important;}
        
        .btn-attack { border-bottom-color: #e74c3c; background: linear-gradient(to bottom, transparent, rgba(231,76,60,0.1));}
        .btn-utility { border-bottom-color: #9b59b6; background: linear-gradient(to bottom, transparent, rgba(155,89,182,0.1));}
        .btn-defense { border-bottom-color: #3498db; background: linear-gradient(to bottom, transparent, rgba(52,152,219,0.1));}
        .btn-heal { border-bottom-color: #2ecc71; background: linear-gradient(to bottom, transparent, rgba(46,204,113,0.1));}
        .btn-mana { border-bottom-color: #f1c40f; background: linear-gradient(to bottom, transparent, rgba(241,196,15,0.1));}

        /* RPS Overlay */
        #rps-overlay { position: absolute; width: 100%; height: 100%; background-color: rgba(2, 6, 23, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; backdrop-filter: blur(8px); direction: rtl;}
        #rps-overlay h2 { color: #fff; margin-bottom: 10px; font-size: 28px; text-shadow: 0 0 15px rgba(255,255,255,0.5); font-weight: 900;}
        #rps-attacker-msg { color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 35px; text-align: center; background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 12px; border: 2px solid #e74c3c; box-shadow: 0 0 20px rgba(231,76,60,0.4), inset 0 0 10px rgba(231,76,60,0.2);}
        #rps-btns { display: flex; gap: 25px; direction: ltr;}
        .rps-btn { font-size: 60px; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 80%); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; width: 110px; height: 110px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(255,255,255,0.1);}
        .rps-btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(255,255,255,0.3);}
        .rps-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.3);}

        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 900; display: none; text-align: center; z-index: 50; background: linear-gradient(135deg, rgba(15, 20, 30, 0.98), rgba(2, 6, 23, 0.98)); padding: 40px; border-radius: 20px; border: 2px solid #f1c40f; box-shadow: 0 0 40px rgba(241, 196, 15, 0.6); direction: rtl;}
    </style>
</head>
<body>

    <div id="selection-screen">
        <h1>اختر منزلك للمبارزة</h1>
        <div class="house-grid">
            <div class="house-btn" id="lion-pick"><span class="house-name">Gryffindor</span></div>
            <div class="house-btn" id="snake-pick"><span class="house-name">Slytherin</span></div>
            <div class="house-btn" id="badger-pick"><span class="house-name">Hufflepuff</span></div>
            <div class="house-btn" id="eagle-pick"><span class="house-name">Ravenclaw</span></div>
        </div>
    </div>

    <div id="game-screen">
        <div id="ui-top">
            <div class="stats-wrapper p1-stats">
                <div class="wizard-label" id="p1-label" style="color: #00ffff;">P1</div>
                <div class="hp-bar-container" id="p1-hp-container"><div id="p1-hp" class="hp-fill"></div></div>
                <div class="mana-bar-container"><div id="p1-mana" class="mana-fill"></div></div>
            </div>
            <div class="stats-wrapper p2-stats">
                <div class="wizard-label" id="p2-label" style="color: #39ff14;">P2</div>
                <div class="hp-bar-container" id="p2-hp-container"><div id="p2-hp" class="hp-fill" style="float: right;"></div></div>
                <div class="mana-bar-container" style="display: flex; justify-content: flex-end;"><div id="p2-mana" class="mana-fill"></div></div>
            </div>
        </div>

        <div id="game-over">النتيجة<br><button onclick="location.reload()" style="padding: 12px 25px; font-size: 18px; margin-top: 25px; cursor: pointer; background: linear-gradient(90deg, #f1c40f, #e67e22); color:#000; border:none; border-radius:8px; font-weight:900; box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);">مبارزة جديدة</button></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>

        <div id="rps-overlay">
            <h2>المواجهة! التعادل يعيد الكرة 🤝</h2>
            <div id="rps-attacker-msg">اختر حجر ورقة مقص ✊✋✌️</div>
            <div id="rps-btns">
                <button class="rps-btn" id="rps-rock">✊</button>
                <button class="rps-btn" id="rps-paper">✋</button>
                <button class="rps-btn" id="rps-scissors">✌️</button>
            </div>
        </div>

        <div id="turn-controls">
            <div id="turn-message">انتظر دورك...</div>
            <div id="action-btns">
                <button class="btn btn-attack" id="btn-incendio">Incendio (20💧)</button>
                <button class="btn btn-attack" id="btn-sectumsempra">Sectumsempra (25💧)</button>
                <button class="btn btn-attack" id="btn-rictusempra">Rictusempra (15💧)</button>
                <button class="btn btn-utility" id="btn-petrificus">Petrificus (25💧)</button>
                <button class="btn btn-utility" id="btn-legilimens">Legilimens (15💧)</button>
                <button class="btn btn-utility" id="btn-confundo">Confundo (10💧)</button>
                <button class="btn btn-defense" id="btn-protego">Protego (10💧)</button>
                <button class="btn btn-heal" id="btn-episkey">Episkey (20💧)</button>
                <button class="btn btn-mana" id="btn-meditate">تأمل (+30💧)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const ui = {
            selection: document.getElementById('selection-screen'), game: document.getElementById('game-screen'),
            p1Hp: document.getElementById('p1-hp'), p1Mana: document.getElementById('p1-mana'), p1Label: document.getElementById('p1-label'),
            p2Hp: document.getElementById('p2-hp'), p2Mana: document.getElementById('p2-mana'), p2Label: document.getElementById('p2-label'),
            message: document.getElementById('turn-message'),
            btns: { 
                incendio: document.getElementById('btn-incendio'), 
                sectumsempra: document.getElementById('btn-sectumsempra'),
                rictusempra: document.getElementById('btn-rictusempra'), 
                petrificus: document.getElementById('btn-petrificus'), 
                legilimens: document.getElementById('btn-legilimens'), 
                confundo: document.getElementById('btn-confundo'), 
                protego: document.getElementById('btn-protego'), 
                episkey: document.getElementById('btn-episkey'), 
                meditate: document.getElementById('btn-meditate') 
            },
            rps: { overlay: document.getElementById('rps-overlay'), rock: document.getElementById('rps-rock'), paper: document.getElementById('rps-paper'), scissors: document.getElementById('rps-scissors'), attackerMsg: document.getElementById('rps-attacker-msg') },
            gameOver: document.getElementById('game-over')
        };

        let isGameOver = false, gameActive = false;
        let p1, p2;
        let turnContext = { attacker: null, defender: null, spell: null, currentTurn: 'player' };
        let screenShake = 0; 
        let globalTime = 0; // for animations

        const houses = {
            lion: { name: 'جريفندور', color: '#00ffff' }, 
            snake: { name: 'سليذرين', color: '#39ff14' }, 
            badger: { name: 'هوفلباف', color: '#f1c40f' },
            eagle: { name: 'ريفينكلو', color: '#3498db' }
        };

        const spellBook = {
            incendio: { name: 'Incendio', damage: 30, cost: 20, color: '#e74c3c', type: 'attack', particleType: 'fire', shake: 15 },
            sectumsempra: { name: 'Sectumsempra', damage: 20, cost: 25, color: '#ff0000', type: 'attack', dotDamage: 15, dotTurns: 3, particleType: 'slash', shake: 12 },
            rictusempra: { name: 'Rictusempra', damage: 10, cost: 15, color: '#f1c40f', type: 'attack', dotDamage: 10, dotTurns: 3, particleType: 'spark', shake: 5 },
            petrificus: { name: 'Petrificus Totalus', damage: 5, cost: 25, color: '#bdc3c7', type: 'attack', stunTurns: 1, particleType: 'beam', shake: 8 },
            legilimens: { name: 'Legilimens', damage: 0, cost: 15, color: '#9b59b6', type: 'utility' },
            confundo: { name: 'Confundo', damage: 0, cost: 10, color: '#9b59b6', type: 'utility', confundoTurns: 1 },
            protego: { name: 'Protego', damage: 0, cost: 10, color: '#3498db', type: 'defense' },
            episkey: { name: 'Episkey', heal: 30, cost: 20, color: '#2ecc71', type: 'heal' }
        };

        // --- VFX Classes ---
        let particles = [];
        let projectiles = [];
        let floatingTexts = [];

        // Stars for Background
        let stars = [];
        for(let i=0; i<80; i++) {
            stars.push({ x: Math.random() * 800, y: Math.random() * 250, size: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.05 });
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y - 40; this.text = text; this.color = color;
                this.life = 1.0; this.vy = -1.5; 
            }
            update() { this.y += this.vy; this.life -= 0.02; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = '900 30px Arial'; ctx.textAlign = 'center';
                ctx.fillStyle = this.color; 
                ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, type) {
                this.x = x; this.y = y; this.color = color; this.type = type;
                this.size = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0; this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.type === 'fire') { this.vy -= 0.2; this.size *= 0.9; } 
                else if (this.type === 'slash') { this.vx *= 0.9; this.vy *= 0.9; this.size *= 0.95; }
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            }
        }

        class Projectile {
            constructor(startX, startY, targetX, targetY, color, type, spellData, onHit) {
                this.x = startX; this.y = startY; this.targetX = targetX; this.targetY = targetY;
                this.color = color; this.type = type; this.spellData = spellData; this.onHit = onHit;
                this.speed = 14;
                const angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.active = true;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.type === 'slash') {
                    particles.push(new Particle(this.x + (Math.random()-0.5)*20, this.y + (Math.random()-0.5)*20, this.color, this.type));
                } else {
                    particles.push(new Particle(this.x, this.y, this.color, this.type));
                }
                
                const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                if (dist < this.speed) {
                    this.active = false;
                    for(let i=0; i<35; i++) particles.push(new Particle(this.x, this.y, this.color, this.type));
                    if(this.spellData && this.spellData.shake) screenShake = this.spellData.shake;
                    if(this.onHit) this.onHit();
                }
            }
            draw() {
                ctx.shadowBlur = 20; ctx.shadowColor = this.color; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // --- Improved Robed Wizard Drawing ---
        function drawWizard(ctx, x, y, color, isFacingRight, state, time) {
            ctx.save();
            // Breathing animation (floating up and down)
            const bob = Math.sin(time / 200) * 4;
            ctx.translate(x, y + bob);
            if (!isFacingRight) ctx.scale(-1, 1);
            
            // Magic glow aura
            ctx.shadowColor = color; ctx.shadowBlur = 25;
            
            // Robe Body
            ctx.beginPath();
            ctx.moveTo(0, -70); // Neck
            ctx.quadraticCurveTo(20, -30, 30, 0); // Right flow
            ctx.lineTo(-30, 0); // Bottom
            ctx.quadraticCurveTo(-20, -30, 0, -70); // Left flow
            ctx.fillStyle = 'rgba(10, 10, 15, 0.95)';
            ctx.fill();
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();

            // Head (Hooded)
            ctx.beginPath();
            ctx.arc(0, -85, 18, 0, Math.PI*2);
            ctx.fillStyle = '#050505'; ctx.fill(); ctx.stroke();

            // Arm & Wand
            ctx.beginPath();
            ctx.lineCap = 'round';
            if (state === 'casting') {
                ctx.moveTo(0, -60); 
                ctx.quadraticCurveTo(25, -65, 45, -60); // Arm extended
                ctx.stroke();
                // Wand
                ctx.beginPath(); ctx.moveTo(45, -60); ctx.lineTo(75, -50); 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
                // Wand Glow
                ctx.beginPath(); ctx.arc(75, -50, 6, 0, Math.PI*2);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.fill();
            } else {
                ctx.moveTo(0, -60); 
                ctx.quadraticCurveTo(15, -40, 25, -20); // Arm relaxed
                ctx.stroke();
            }
            ctx.restore();
        }

        class WizardPlayer {
            constructor(x, color, isFacingRight, labelColor) {
                this.x = x; this.y = canvas.height - 40; // Floor level
                this.color = labelColor; 
                this.health = 100; this.mana = 100;
                this.isShielding = false; this.isFacingRight = isFacingRight;
                this.stunTurns = 0; this.confundoTurns = 0; this.bleedTurns = 0;
                this.state = 'idle';
                this.hasLegilimens = false; // NEW BUG FIX
            }

            draw() {
                // Shield (Protego) - Particle Dome
                if (this.isShielding) {
                    ctx.save();
                    ctx.translate(this.x, this.y - 45);
                    ctx.beginPath(); ctx.arc(0, 0, 75, Math.PI, 0);
                    ctx.strokeStyle = '#3498db'; ctx.lineWidth = 4;
                    ctx.setLineDash([12, 8]); 
                    ctx.lineDashOffset = -globalTime / 15; 
                    ctx.shadowBlur = 25; ctx.shadowColor = '#3498db'; ctx.stroke();
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.15)'; ctx.fill();
                    ctx.restore();
                }

                drawWizard(ctx, this.x, this.y, this.color, this.isFacingRight, this.state, globalTime);

                // Status Effects UI
                let statusY = this.y - 120;
                ctx.font = '26px Arial'; ctx.textAlign = 'center'; ctx.shadowBlur = 0;
                if (this.stunTurns > 0) { ctx.fillText('💤', this.x, statusY); statusY -= 30; }
                if (this.confundoTurns > 0) { ctx.fillText('💫', this.x, statusY); statusY -= 30; }
                if (this.hasLegilimens) { ctx.fillText('👁️', this.x, statusY); statusY -= 30; } // Show mind control active
                if (this.bleedTurns > 0) { 
                    // Fire/Blood ring at feet
                    ctx.save();
                    ctx.beginPath(); ctx.ellipse(this.x, this.y, 40, 8, 0, 0, Math.PI*2);
                    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3; ctx.shadowBlur=15; ctx.shadowColor='#ff0000'; ctx.stroke();
                    ctx.restore();
                    if(Math.random() < 0.4) particles.push(new Particle(this.x + (Math.random()-0.5)*40, this.y, '#ff0000', 'fire'));
                }
            }
            canCast(spell) { return this.mana >= spell.cost; }
            consumeMana(spell) { this.mana -= spell.cost; if(this.mana < 0) this.mana = 0; }
        }

        function updateStatsUI() {
            ui.p1Hp.style.width = p1.health + '%'; ui.p1Mana.style.width = p1.mana + '%';
            ui.p2Hp.style.width = p2.health + '%'; ui.p2Mana.style.width = p2.mana + '%';
        }

        function chooseHouse(houseKey) {
            ui.selection.style.opacity = '0';
            setTimeout(() => {
                ui.selection.style.display = 'none'; ui.game.style.display = 'flex'; ui.game.style.opacity = '1';
                
                p1 = new WizardPlayer(150, houses[houseKey], true, '#00ffff'); 
                p2 = new WizardPlayer(canvas.width - 150, houses['snake'], false, '#39ff14'); 
                
                ui.p1Label.innerText = 'P1 (' + houses[houseKey].name + ')';
                ui.p1Label.style.color = '#00ffff'; 
                document.getElementById('p1-hp-container').style.borderColor = '#00ffff';
                
                ui.p2Label.innerText = 'P2 (AI)';
                ui.p2Label.style.color = '#39ff14';
                document.getElementById('p2-hp-container').style.borderColor = '#39ff14';

                gameActive = true; updateStatsUI(); animate(); startP1Turn();
            }, 500);
        }

        ['lion', 'snake', 'badger', 'eagle'].forEach(h => {
            const btn = document.getElementById(`${h}-pick`);
            if(btn) btn.addEventListener('click', () => chooseHouse(h));
        });

        function toggleButtons(enable) { 
            Object.values(ui.btns).forEach(btn => { if(btn) btn.disabled = !enable; }); 
        }

        let pendingAIChoice = null;

        function handleP1Action(spellKey) {
            if (isGameOver || turnContext.currentTurn !== 'player') return;
            const spell = spellBook[spellKey];

            if (!p1.canCast(spell)) { ui.message.innerText = `❌ مانا غير كافية!`; return; }

            p1.state = 'casting';

            if (spell.type === 'attack') {
                turnContext.attacker = p1; turnContext.defender = p2; turnContext.spell = spell;
                p1.isShielding = false; toggleButtons(false); ui.rps.overlay.style.display = 'flex';
                
                // BUG FIX: Check if P1 has the Legilimens buff
                if (p1.hasLegilimens) {
                    pendingAIChoice = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
                    ui.rps.attackerMsg.innerHTML = `🔮 أفكار مكشوفة! الخصم سيدافع بـ: <b>${ {rock:'✊',paper:'✋',scissors:'✌️'}[pendingAIChoice] }</b>`;
                    ui.rps.attackerMsg.style.borderColor = '#9b59b6'; ui.rps.attackerMsg.style.color = '#fff';
                    p1.hasLegilimens = false; // Consume the buff
                } else {
                    ui.rps.attackerMsg.innerText = `أنت تهاجم بـ ${spell.name}! اختر بسرعة ✊✋✌️`;
                    ui.rps.attackerMsg.style.borderColor = '#e74c3c'; ui.rps.attackerMsg.style.color = '#fff';
                    pendingAIChoice = null;
                }
            } else if (spell.type === 'defense') { executeDefense(p1, spell); } 
              else if (spell.type === 'heal') { executeHeal(p1, spell); } 
              else if (spell.type === 'utility') {
                if (spell.legilimensActive) executeLegilimens(p1, spell);
                else if (spell.confundoTurns) executeConfundo(p1, p2, spell);
            }
        }

        ui.btns.meditate.addEventListener('click', () => {
            if (isGameOver || turnContext.currentTurn !== 'player') return;
            p1.state = 'idle';
            p1.mana += 30; if (p1.mana > 100) p1.mana = 100;
            ui.message.innerText = 'تأملت واستعدت مانا 💧.'; p1.isShielding = false; 
            floatingTexts.push(new FloatingText(p1.x, p1.y, '+30 Mana', '#3498db'));
            updateStatsUI(); toggleButtons(false); setTimeout(startAITurn, 1500);
        });

        function handleRPS(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const aiChoice = pendingAIChoice ? pendingAIChoice : choices[Math.floor(Math.random() * choices.length)];
            pendingAIChoice = null; const rpsEmojis = { rock: '✊', paper: '✋', scissors: '✌️' };
            const isPlayerAttacking = (turnContext.attacker === p1);
            
            if (playerChoice === aiChoice) {
                ui.rps.attackerMsg.innerText = `تعادل🤝 ${rpsEmojis[playerChoice]} ضد ${rpsEmojis[aiChoice]}! أعد الكرة!`;
                ui.rps.attackerMsg.style.color = '#f1c40f'; ui.rps.attackerMsg.style.borderColor = '#f1c40f'; return;
            }

            ui.rps.overlay.style.display = 'none';
            ui.message.innerText = `اخترت ${rpsEmojis[playerChoice]}، وهو ${rpsEmojis[aiChoice]}...`;

            setTimeout(() => {
                let damageMultiplier = 1;
                if ( (playerChoice === 'rock' && aiChoice === 'scissors') || (playerChoice === 'paper' && aiChoice === 'rock') || (playerChoice === 'scissors' && aiChoice === 'paper') ) {
                    if (isPlayerAttacking) { ui.message.innerText = 'كسبت المواجهة🔥! ضرر كامل.'; damageMultiplier = 1; } 
                    else { ui.message.innerText = 'دافعت بنجاح🛡️! ضرره النص.'; damageMultiplier = 0.5; }
                } else {
                    if (isPlayerAttacking) { ui.message.innerText = 'صدوك في الدفاع🛡️! ضررك النص.'; damageMultiplier = 0.5; } 
                    else { ui.message.innerText = 'فشلت في الدفاع💥! ضرره كامل.'; damageMultiplier = 1; }
                }
                
                turnContext.attacker.state = 'casting';
                const startX = turnContext.attacker.x + (turnContext.attacker.isFacingRight ? 50 : -50);
                const startY = turnContext.attacker.y - 50;
                const endX = turnContext.defender.x;
                const endY = turnContext.defender.y - 40;

                projectiles.push(new Projectile(startX, startY, endX, endY, turnContext.spell.color, turnContext.spell.particleType, turnContext.spell, () => {
                    executeAttackHit(turnContext.attacker, turnContext.defender, turnContext.spell, damageMultiplier);
                    turnContext.attacker.state = 'idle';
                }));

            }, 1000);
        }

        ['rock', 'paper', 'scissors'].forEach(id => {
            if(ui.rps[id]) ui.rps[id].addEventListener('click', () => handleRPS(id));
        });

        function executeAttackHit(caster, target, spell, multiplier) {
            caster.consumeMana(spell);
            let finalDamage = spell.damage * multiplier;
            if (caster.confundoTurns > 0) { finalDamage *= 0.5; caster.confundoTurns = 0; }
            if (target.isShielding) finalDamage *= 0.5;
            
            finalDamage = Math.floor(finalDamage);
            target.health -= finalDamage; if (target.health < 0) target.health = 0;
            
            floatingTexts.push(new FloatingText(target.x, target.y, `-${finalDamage}`, '#e74c3c'));
            updateStatsUI();

            if (spell.dotTurns) { target.bleedTurns = spell.dotTurns; target.bleedDamage = spell.dotDamage; }
            if (spell.stunTurns) { target.stunTurns = spell.stunTurns; }

            if (target.health <= 0) { endGame((caster === p1) ? 'فزت! بطل هوجوورتس🏆' : 'الكمبيوتر هزمك!🐍'); return; }
            if (caster === p1) setTimeout(startAITurn, 1500); else startP1Turn();
        }

        function spawnSelfParticles(wizard, color) {
            for(let i=0; i<40; i++) particles.push(new Particle(wizard.x, wizard.y - 40, color, 'spark'));
        }

        function executeDefense(caster, spell) {
            caster.consumeMana(spell); caster.isShielding = true; updateStatsUI();
            ui.message.innerText = `تعويذة Protego 🛡️ مفعلة.`;
            toggleButtons(false); spawnSelfParticles(caster, spell.color);
            caster.state = 'idle';
            if (caster === p1) setTimeout(startAITurn, 1500); else startP1Turn();
        }

        function executeHeal(caster, spell) {
            caster.consumeMana(spell); caster.isShielding = false; caster.health += spell.heal;
            if (caster.health > 100) caster.health = 100; updateStatsUI();
            ui.message.innerText = `تعويذة Episkey ✨.`;
            floatingTexts.push(new FloatingText(caster.x, caster.y, `+${spell.heal} HP`, '#2ecc71'));
            toggleButtons(false); spawnSelfParticles(caster, spell.color);
            caster.state = 'idle';
            if (caster === p1) setTimeout(startAITurn, 1500); else startP1Turn();
        }

        // BUG FIX: Legilimens now applies to the caster
        function executeLegilimens(caster, spell) {
            caster.consumeMana(spell); caster.isShielding = false; updateStatsUI();
            ui.message.innerText = `تعويذة Legilimens 🔮. هتقرأ أفكاره الهجمة الجاية!`;
            caster.hasLegilimens = true; 
            toggleButtons(false); spawnSelfParticles(caster, spell.color);
            caster.state = 'idle';
            if (caster === p1) setTimeout(startAITurn, 1500); else startP1Turn();
        }

        function executeConfundo(caster, target, spell) {
            caster.consumeMana(spell); caster.isShielding = false; updateStatsUI();
            ui.message.innerText = `تعويذة Confundo 💫 (ارتباك للخصم).`;
            target.confundoTurns = 1; toggleButtons(false); spawnSelfParticles(target, spell.color);
            caster.state = 'idle';
            if (caster === p1) setTimeout(startAITurn, 1500); else startP1Turn();
        }

        function applyTurnEffects(wizard) {
            if (wizard.bleedTurns > 0) {
                wizard.health -= wizard.bleedDamage; if (wizard.health < 0) wizard.health = 0;
                ui.message.innerText = `🩸 أثر النزيف (-${wizard.bleedDamage} HP).`; wizard.bleedTurns--; 
                floatingTexts.push(new FloatingText(wizard.x, wizard.y, `-${wizard.bleedDamage}`, '#ff0000'));
                updateStatsUI(); return true;
            }
            return false;
        }

        function startP1Turn() {
            if (isGameOver) return; turnContext.currentTurn = 'player'; p1.isShielding = false; p1.state = 'idle';
            const bleedApplied = applyTurnEffects(p1);
            if (p1.stunTurns > 0) { p1.stunTurns--; ui.message.innerText += ' 💤 مشلول! دورك ضاع.'; toggleButtons(false); setTimeout(startAITurn, 2000); return; }
            setTimeout(() => { toggleButtons(true); ui.message.innerText = 'دورك الآن! اختر تعويذة 👇'; ui.message.style.color = '#00ffff'; }, bleedApplied ? 2000 : 0);
        }

        function startAITurn() {
            if (isGameOver) return; turnContext.currentTurn = 'ai'; toggleButtons(false); p2.state = 'idle';
            ui.message.innerText = 'دور الكمبيوتر... 🧠'; ui.message.style.color = '#e74c3c'; p2.isShielding = false;
            const bleedApplied = applyTurnEffects(p2);
            if (p2.stunTurns > 0) { p2.stunTurns--; ui.message.innerText += ' 💤 الكمبيوتر مشلول!.'; setTimeout(startP1Turn, 2000); return; }

            setTimeout(() => {
                if (p2.health < 40 && p2.canCast(spellBook.episkey)) { p2.state='casting'; executeHeal(p2, spellBook.episkey); }
                else if (p2.mana < 20) { 
                    p2.mana += 30; if (p2.mana > 100) p2.mana = 100; ui.message.innerText = 'الكمبيوتر يتأمل 💧.'; 
                    floatingTexts.push(new FloatingText(p2.x, p2.y, '+30 Mana', '#3498db'));
                    updateStatsUI(); setTimeout(startP1Turn, 1500); 
                }
                else if (p1.bleedTurns > 0 && p2.canCast(spellBook.petrificus)) { p2.state='casting'; executeSpellAI(p2, p1, spellBook.petrificus); }
                else if (p1.isShielding && Math.random() < 0.5 && p2.canCast(spellBook.legilimens)) { p2.state='casting'; executeLegilimens(p2, spellBook.legilimens); }
                else if (Math.random() < 0.3 && p2.canCast(spellBook.confundo)) { p2.state='casting'; executeConfundo(p2, p1, spellBook.confundo); }
                else {
                    p2.state='casting';
                    // AI favors Sectumsempra and Incendio
                    let spellToCast = spellBook.sectumsempra;
                    if (!p2.canCast(spellBook.sectumsempra)) spellToCast = spellBook.incendio;
                    if (!p2.canCast(spellBook.incendio)) spellToCast = spellBook.rictusempra;
                    executeSpellAI(p2, p1, spellToCast);
                }
            }, bleedApplied ? 2000 : 1500);
        }

        function executeSpellAI(caster, target, spell) {
            turnContext.attacker = caster; turnContext.defender = target; turnContext.spell = spell;
            let aiChoice = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
            ui.message.innerText = `الكمبيوتر يجهز ${spell.name}! دافع⚔️`;
            setTimeout(() => {
                ui.rps.overlay.style.display = 'flex';
                // BUG FIX: If target (P1) has Legilimens, reveal AI choice
                if (target.hasLegilimens) {
                    ui.rps.attackerMsg.innerHTML = `🔮 أفكار مكشوفة! سيلعب: <b>${ {rock:'✊',paper:'✋',scissors:'✌️'}[aiChoice] }</b>!`;
                    ui.rps.attackerMsg.style.borderColor = '#9b59b6'; ui.rps.attackerMsg.style.color = '#fff';
                    target.hasLegilimens = false; pendingAIChoice = aiChoice;
                } else {
                    ui.rps.attackerMsg.innerText = `يهاجمك بـ ${spell.name}! اختر حجر ورقة مقص للدفاع 🛡️`;
                    ui.rps.attackerMsg.style.borderColor = '#e74c3c'; ui.rps.attackerMsg.style.color = '#fff';
                    pendingAIChoice = null;
                }
            }, 800);
        }

        function endGame(message) {
            isGameOver = true; toggleButtons(false); gameActive = false;
            ui.gameOver.innerHTML = message + '<br><button onclick="location.reload()" style="padding: 12px 25px; font-size: 18px; margin-top: 25px; cursor: pointer; background: linear-gradient(90deg, #f1c40f, #e67e22); color:#000; border:none; border-radius:8px; font-weight:900;">مبارزة جديدة</button>';
            ui.gameOver.style.display = 'block'; ui.message.innerText = 'انتهت المبارزة.';
        }

        Object.keys(ui.btns).forEach(key => { if(ui.btns[key]) ui.btns[key].addEventListener('click', () => { if(key!=='meditate') handleP1Action(key); }); });

        // --- Enhanced Background Drawing ---
        function drawBackground() {
            // Sky gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height - 40);
            skyGrad.addColorStop(0, '#020024');
            skyGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = skyGrad; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Moon
            ctx.beginPath(); ctx.arc(canvas.width - 120, 100, 50, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 50; ctx.shadowColor = '#f1c40f'; ctx.fill();
            ctx.shadowBlur = 0;

            // Castle Silhouettes (Background)
            ctx.fillStyle = '#060b14';
            ctx.fillRect(50, canvas.height - 180, 80, 150);
            ctx.beginPath(); ctx.moveTo(50, canvas.height - 180); ctx.lineTo(90, canvas.height - 240); ctx.lineTo(130, canvas.height - 180); ctx.fill();
            
            ctx.fillRect(200, canvas.height - 150, 60, 120);
            ctx.fillRect(650, canvas.height - 200, 100, 170);
            ctx.beginPath(); ctx.moveTo(650, canvas.height - 200); ctx.lineTo(700, canvas.height - 280); ctx.lineTo(750, canvas.height - 200); ctx.fill();

            // Glowing Windows
            ctx.fillStyle = 'rgba(241, 196, 15, 0.5)';
            ctx.shadowBlur = 10; ctx.shadowColor = '#f1c40f';
            ctx.fillRect(85, canvas.height - 150, 10, 20);
            ctx.fillRect(695, canvas.height - 160, 10, 25);
            ctx.shadowBlur = 0;

            // Wall/Ground
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
            
            // Ground perspective lines
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3;
            for(let i=0; i<canvas.width; i+=60) { 
                ctx.beginPath(); ctx.moveTo(i, canvas.height-60); ctx.lineTo(i-30, canvas.height); ctx.stroke(); 
            }
            ctx.beginPath(); ctx.moveTo(0, canvas.height-60); ctx.lineTo(canvas.width, canvas.height-60); ctx.stroke();
        }

        function animate() {
            if(!gameActive) return;
            globalTime += 16;
            
            ctx.save();
            if (screenShake > 0) {
                const dx = (Math.random() - 0.5) * screenShake;
                const dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.85; 
                if (screenShake < 0.5) screenShake = 0;
            }

            drawBackground();
            if (p1 && p2) { p1.draw(); p2.draw(); }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].update(); projectiles[i].draw();
                if (!projectiles[i].active) projectiles.splice(i, 1);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update(); floatingTexts[i].draw();
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            ctx.restore();
            window.requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
